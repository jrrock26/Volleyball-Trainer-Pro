name: Build Dev Client (Fastlane)

on:
  workflow_dispatch:

jobs:
  build-dev-client:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ruby + Bundler + Fastlane
        run: |
          gem install bundler
          bundle install

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Install VBTPDEV provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ios/VBTPDEV.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/VBTPDEV.mobileprovision

      - name: Build Dev Client with Fastlane
        run: |
          bundle exec fastlane ios dev_client

      - name: Upload Dev Client IPA
        uses: actions/upload-artifact@v4
        with:
          name: DevClient-IPA
          path: ./*.ipa
