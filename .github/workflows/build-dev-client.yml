name: Build Dev Client

on:
  workflow_dispatch:

jobs:
  build-dev-client:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Dev Client IPA with xcodebuild
        run: |
          xcodebuild \
            -workspace ios/VolleyballTrainerProClean.xcworkspace \
            -scheme VolleyballTrainerProClean \
            -configuration Debug \
            -archivePath build/DevClient.xcarchive \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath build/DevClient.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build

      - name: Upload Dev Client IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevClient-IPA
          path: build/*.ipa


