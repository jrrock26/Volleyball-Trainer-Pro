name: Build Dev Client

on:
  workflow_dispatch:

jobs:
  build-dev-client:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: restore-039b6df

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install JS dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -NV
          cd ios
          pod install

      # -----------------------------
      # Install Fastlane via Bundler
      # -----------------------------
      - name: Create Gemfile for Fastlane
        run: |
          cat <<EOF > Gemfile
          source "https://rubygems.org"
          gem "fastlane", "2.233.1"
          EOF

      - name: Install Bundler + Fastlane
        run: |
          gem install bundler -NV
          bundle config set path 'vendor/bundle'
          bundle install

      # -----------------------------
      # Prepare API Key JSON
      # -----------------------------
      - name: Prepare Fastlane API key JSON
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ESCAPED_KEY=$(printf "%s" "$ASC_API_KEY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          cat <<EOF > fastlane_api_key.json
          {
            "key_id": "${ASC_KEY_ID}",
            "issuer_id": "${ASC_ISSUER_ID}",
            "key": $ESCAPED_KEY
          }
          EOF

      # -----------------------------
      # Build Dev Client IPA
      # -----------------------------
      - name: Build Dev Client IPA with Fastlane
        run: |
          cd ios
          bundle exec fastlane gym \
            --workspace "VolleyballTrainerPro.xcworkspace" \
            --scheme "VolleyballTrainerPro" \
            --configuration Debug \
            --export_method ad-hoc \
            --api-key ../fastlane_api_key.json \
            --output_directory "../build" \
            --output_name "DevClient.ipa"

      # -----------------------------
      # Upload IPA Artifact
      # -----------------------------
      - name: Upload Dev Client IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevClient-IPA
          path: build/DevClient.ipa


