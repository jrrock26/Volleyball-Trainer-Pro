name: iOS Dev Client Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Bundler
        run: gem install bundler

      - name: Install dependencies
        run: bundle install

      # ⭐ Install iOS Development Certificate (.p12)
      - name: Install iOS Development Certificate
        run: |
          echo "$IOS_DEV_CERT_P12" | base64 --decode > dev_cert.p12
          security create-keychain -p "" build.keychain
          security import dev_cert.p12 -k build.keychain -P "$IOS_DEV_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings build.keychain

      # ⭐ Install provisioning profile (VBTPDEV)
      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_DEV_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/VBTPDEV.mobileprovision

      # ⭐ Build Dev Client using Fastlane
      - name: Build iOS Dev Client
        run: bundle exec fastlane ios dev_client
        env:
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ""
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_PROFILE: ${{ secrets.IOS_DEV_PROFILE }}
          APPLE_TEAM_ID: "2G78XY4X97"
