name: Build Dev Client

on:
  workflow_dispatch:

jobs:
  build-dev-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Login to Expo
        run: eas login --token ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS Dev Client
        run: eas build --platform ios --profile development-ios --non-interactive

      - name: Build Android Dev Client
        run: eas build --platform android --profile development-android --non-interactive
