name: iOS Crash Debug (Verbose)

on:
  workflow_dispatch:

jobs:
  crash-debug:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Find & Boot Simulator
        id: sim
        run: |
          set -e
          SIM_ID=$(xcrun simctl list devices | grep "iPhone 15" | grep -oE "[A-F0-9-]{36}" | head -n 1)

          if [ -z "$SIM_ID" ]; then
            echo "No iPhone 15 simulator found. Creating one..."
            SIM_ID=$(xcrun simctl create "iPhone 15" com.apple.CoreSimulator.SimDeviceType.iPhone-15 com.apple.CoreSimulator.SimRuntime.iOS-17-4)
          fi

          echo "Using simulator: $SIM_ID"
          echo "SIM_ID=$SIM_ID" >> $GITHUB_ENV

          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID"

      - name: Build Debug App (Verbose)
        run: |
          set -o pipefail
          mkdir -p buildlogs
          xcodebuild \
            -workspace ios/VolleyballTrainerPro.xcworkspace \
            -scheme VolleyballTrainerPro \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            build \
            | tee buildlogs/xcodebuild.log

      - name: Upload Build Logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcode-build-logs
          path: buildlogs

      - name: Install App on Simulator
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -name "*.app" | head -n 1)
          echo "Installing app: $APP_PATH"
          xcrun simctl install "$SIM_ID" "$APP_PATH"

      - name: Start Log Capture
        run: |
          mkdir -p crashlogs
          xcrun simctl spawn "$SIM_ID" log stream --level debug --style compact > crashlogs/device.log &
          echo $! > crashlogs/log_pid.txt
          sleep 3

      - name: Launch App
        run: |
          xcrun simctl launch "$SIM_ID" com.yourteam.volleyballtrainerpro || true
          sleep 10

      - name: Stop Log Capture
        run: |
          kill $(cat crashlogs/log_pid.txt) || true

      - name: Collect Crash Reports
        run: |
          mkdir -p crashlogs/reports
          cp ~/Library/Logs/DiagnosticReports/*.ips crashlogs/reports/ || true

      - name: Upload Crash Logs
        uses: actions/upload-artifact@v4
        with:
          name: crash-debug-logs
          path: crashlogs
