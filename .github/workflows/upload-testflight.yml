name: Upload IPA from Artifact ID to TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-14

    env:
      ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifact ZIP using GitHub API
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -o artifact.zip \
            "https://api.github.com/repos/jrrock26/Volleyball-Trainer-Pro/actions/artifacts/6952379122/zip"

      - name: Extract IPA
        run: |
          unzip artifact.zip
          IPA_FILE=$(ls *.ipa)
          echo "IPA_FILE=$IPA_FILE" >> $GITHUB_ENV

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      - name: Create API key JSON
        run: |
          echo "$ASC_API_KEY" | base64 --decode > AuthKey.p8
          cat <<EOF > api_key.json
          {
            "key_id": "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key": "$(cat AuthKey.p8 | sed 's/$/\\n/' | tr -d '\n')"
          }
          EOF

      - name: Upload IPA to TestFlight
        run: |
          fastlane deliver \
            --ipa "$IPA_FILE" \
            --api_key_path api_key.json \
            --skip_screenshots \
            --skip_metadata

