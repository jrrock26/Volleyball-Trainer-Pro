name: Upload IPA to TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      - name: Create API key JSON
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "$ASC_API_KEY" | base64 --decode > AuthKey.p8
          cat <<EOF > api_key.json
          {
            "key_id": "$ASC_KEY_ID",
            "issuer_id": "$ASC_ISSUER_ID",
            "key": "$(cat AuthKey.p8 | sed 's/$/\\n/' | tr -d '\n')"
          }
          EOF

      - name: Upload IPA to TestFlight
        run: |
          fastlane deliver \
            --ipa "ios/build/output/VolleyballTrainerPro.ipa" \
            --api_key_path api_key.json \
            --skip_screenshots \
            --skip_metadata
