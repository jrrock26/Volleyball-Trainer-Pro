name: Upload IPA to TestFlight

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-14

    env:
      APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
      APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifact ZIP
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o artifact.zip \
            "https://api.github.com/repos/jrrock26/Volleyball-Trainer-Pro/actions/artifacts/6952379122/zip"

      - name: Extract IPA
        run: |
          unzip artifact.zip
          IPA_FILE=$(ls *.ipa)
          echo "IPA_FILE=$IPA_FILE" >> $GITHUB_ENV

      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      - name: Upload IPA to TestFlight (Apple ID login)
        run: |
          fastlane deliver \
            --ipa "$IPA_FILE" \
            --username "$APP_STORE_CONNECT_USERNAME" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --app_identifier "com.yourteam.volleyballtrainerpro" \
            --skip_screenshots \
            --skip_metadata \
            --force
