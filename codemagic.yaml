workflows:
  ios_build:
    name: iOS TestFlight Build
    environment:
      groups:
        - APP_CREDENTIALS
      vars:
        XCODE_WORKSPACE: "ios/volleyballtrainerpro.xcworkspace"
        XCODE_SCHEME: "volleyballtrainerpro"
      xcode: "16.1"

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Clean iOS build artifacts
        script: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf build
          cd ..

      - name: Install CocoaPods (generate workspace)
        script: |
          cd ios
          pod install
          cd ..
          ls ios

      - name: Decode signing files
        script: |
          echo "$IOS_CERT_P12" | base64 --decode > signing_cert.p12
          echo "$IOS_PROVISION_PROFILE" | base64 --decode > profile.mobileprovision

      - name: Set up keychain
        script: |
          security create-keychain -p "" build.keychain
          security import signing_cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings build.keychain

      - name: Build IPA
        script: |
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build

      - name: Upload to TestFlight
        script: |
          echo "$ASC_API_KEY" | base64 --decode > AuthKey.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/*.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_KEY_ISSUER_ID"

    artifacts:
      - build/*.ipa
