workflows:
  ios_build:
    name: iOS TestFlight Build
    environment:
      groups:
        - APP_CREDENTIALS
      vars:
        XCODE_WORKSPACE: "ios/volleyballtrainerpro.xcworkspace"
        XCODE_SCHEME: "volleyballtrainerpro"
      xcode: "16.1"

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Clean iOS build artifacts
        script: |
          echo "=== Cleaning iOS build artifacts ==="
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock
          rm -rf build
          cd ..

      - name: Install CocoaPods (generate workspace)
        script: |
          echo "=== Running pod repo update ==="
          cd ios
          pod repo update --verbose
          echo "=== Running pod install ==="
          pod install --verbose
          echo "=== Listing ios directory after pod install ==="
          ls -la
          cd ..

      - name: Debug iOS folder
        script: |
          echo "=== FULL iOS DIRECTORY TREE ==="
          ls -R ios

      - name: Decode signing files
        script: |
          echo "=== Decoding signing files ==="
          echo "$IOS_CERT_P12" | base64 --decode > signing_cert.p12
          echo "$IOS_PROVISION_PROFILE" | base64 --decode > profile.mobileprovision

      - name: Set up keychain
        script: |
          echo "=== Setting up keychain ==="
          security create-keychain -p "" build.keychain
          security import signing_cert.p12 -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings build.keychain

      - name: Build IPA
        script: |
          echo "=== Starting Xcode archive ==="
          xcodebuild \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            archive | xcpretty

          echo "=== Listing build directory after archive ==="
          ls -R build || true

          echo "=== Exporting IPA ==="
          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/exportOptions.plist \
            -exportPath build | xcpretty

          echo "=== Final build directory ==="
          ls -R build || true

      - name: Upload to TestFlight
        script: |
          echo "=== Uploading IPA to TestFlight ==="
          echo "$ASC_API_KEY" | base64 --decode > AuthKey.p8
          xcrun altool --upload-app \
            --type ios \
            --file build/*.ipa \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_KEY_ISSUER_ID"

    artifacts:
      - build/*.ipa
