workflows:
  ios-dev-client:
    name: iOS Dev Client (Signed)

    instance_type: mac_mini_m2

    environment:
      xcode: latest
      node: latest

    scripts:
      - name: Install JS dependencies
        script: npm install

      - name: Install CocoaPods
        script: |
          cd ios
          pod install --repo-update

      - name: Build iOS Dev Client (signed)
        script: |
          cd ios
          xcodebuild \
            -workspace VolleyballTrainerPro.xcworkspace \
            -scheme VolleyballTrainerPro \
            -configuration Debug \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=2G78XY4X97 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=YES \
            PROVISIONING_PROFILE_SPECIFIER="VolleyballTrainerPro AdHoc" \
            build

      - name: Package IPA (signed)
        script: |
          cd ios/build/Build/Products/Debug-iphoneos
          mkdir Payload
          cp -R VolleyballTrainerPro.app Payload/
          zip -r VolleyballTrainerPro.ipa Payload

    artifacts:
      - ios/build/Build/Products/Debug-iphoneos/VolleyballTrainerPro.ipa

